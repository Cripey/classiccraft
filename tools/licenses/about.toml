# cargo-about (https://github.com/EmbarkStudios/cargo-about) settings for the classiccraft client's
# third-party notices; the release workflow runs it in the benilla fork's workspace.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "OFL-1.1",
    "CDLA-Permissive-2.0",
    "NCSA",
    "BSD-1-Clause",
    "Ubuntu-font-1.0",
]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
ignore-build-dependencies = false
ignore-dev-dependencies = true
